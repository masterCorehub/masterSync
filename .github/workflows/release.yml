name: Release MasterSync

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex: latest ou v0.3.6)'
        required: true
        default: 'latest'
        type: string
      prerelease:
        description: 'Marcar como pré-lançamento'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

permissions:
  contents: write

jobs:
  macos:
    name: macOS (.dmg e .zip)
    runs-on: macos-15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK (leitor ADB)
        uses: android-actions/setup-android@v3
        with:
          # O padrão da ação instala o pacote 'tools', que não existe mais; o passo seguinte instala o que o build usa.
          packages: ''

      - name: Instalar Android Platform 36 e Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar assinatura Developer ID (opcional)
        env:
          CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [[ -n "$CERT_P12_B64" && -n "$CERT_PASS" && -n "$SIGN_ID" ]]; then
            kc="$RUNNER_TEMP/nexus-build.keychain-db"
            kc_pass="$(openssl rand -hex 16)"
            p12="$RUNNER_TEMP/cert.p12"
            trap 'rm -f "$p12"' EXIT
            printf '%s' "$CERT_P12_B64" | base64 --decode > "$p12"
            security create-keychain -p "$kc_pass" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kc_pass" "$kc"
            security import "$p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$kc" -T /usr/bin/codesign -T /usr/bin/security
            security list-keychains -d user -s "$kc" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc"
            echo "NEXUS_SIGN_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"
          else
            echo "NEXUS_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Compilar macOS (.app, .zip e .dmg)
        run: |
          chmod +x scripts/build-macos.sh scripts/build-dmg.sh scripts/build-adb-clipboard.sh
          ./scripts/build-macos.sh

      - name: Preparar artefatos macOS
        run: |
          mkdir -p release-macos
          cp "dist/MasterSync-macOS.dmg" "release-macos/MasterSync-macOS.dmg"
          cp "dist/Nexus masterSync macOS.zip" "release-macos/MasterSync-macOS.zip"

      - name: Enviar artefatos macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-macos/

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O padrão da ação instala o pacote 'tools', que não existe mais; o passo seguinte instala o que o build usa.
          packages: ''

      - name: Instalar Android Platform 36 e Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Rodar testes unitários Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:testFullDebugUnitTest :app:testDirectDebugUnitTest

      - name: Gerar APKs (Full e Direct)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-android
          cd android
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            ./gradlew :app:assembleFullRelease :app:assembleDirectRelease
            ks="$RUNNER_TEMP/release.jks"
            trap 'rm -f "$ks"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
            bt="$ANDROID_HOME/build-tools/36.0.0"

            "$bt/zipalign" -p 4 app/build/outputs/apk/full/release/app-full-release-unsigned.apk "$RUNNER_TEMP/full-aligned.apk"
            "$bt/apksigner" sign --ks "$ks" --ks-pass "pass:$KEYSTORE_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
              --out ../release-android/MasterSync-Android-Completo.apk "$RUNNER_TEMP/full-aligned.apk"
            "$bt/apksigner" verify ../release-android/MasterSync-Android-Completo.apk

            "$bt/zipalign" -p 4 app/build/outputs/apk/direct/release/app-direct-release-unsigned.apk "$RUNNER_TEMP/direct-aligned.apk"
            "$bt/apksigner" sign --ks "$ks" --ks-pass "pass:$KEYSTORE_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
              --out ../release-android/MasterSync-Android-Direto.apk "$RUNNER_TEMP/direct-aligned.apk"
            "$bt/apksigner" verify ../release-android/MasterSync-Android-Direto.apk
          else
            ./gradlew :app:assembleFullDebug :app:assembleDirectDebug
            cp app/build/outputs/apk/full/debug/app-full-debug.apk ../release-android/MasterSync-Android-Completo-debug.apk
            cp app/build/outputs/apk/direct/debug/app-direct-debug.apk ../release-android/MasterSync-Android-Direto-debug.apk
          fi

      - name: Enviar artefatos Android
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-android/

  release:
    name: Publicar GitHub Release
    needs: [macos, android]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Gerar checksums e publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Este job não baixa o código; sem isso o `gh release` não sabe em qual repositório agir.
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          HAS_ANDROID_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG:-latest}"
            TITLE="MasterSync ${TAG}"
            IS_ROLLING=$([[ "$TAG" == "latest" ]] && echo true || echo false)
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="MasterSync ${TAG}"
            IS_ROLLING=false
          else
            TAG="latest"
            TITLE="MasterSync (build automático da main)"
            IS_ROLLING=true
          fi

          short_sha="${GITHUB_SHA:0:7}"
          mac_note="Assinado com Developer ID."
          if [[ "$HAS_MACOS_CERT" != "true" ]]; then
            mac_note="Assinatura local ad hoc — se o Gatekeeper avisar ao abrir, use Clique direito → Abrir ou permita em Ajustes do Sistema → Privacidade e Segurança."
          fi

          android_note="APKs release assinados."
          if [[ "$HAS_ANDROID_KS" != "true" ]]; then
            android_note="APKs em modo debug (configure os Secrets da keystore para assinatura release definitiva)."
          fi

          cat > release-notes.md <<EOF
          Build gerado a partir do commit \`${short_sha}\`.

          ### macOS (14+ · Apple Silicon)
          - **\`MasterSync-macOS.dmg\`**: abra e arraste **Nexus masterSync.app** para **Aplicativos**.
          - **\`MasterSync-macOS.zip\`**: arquivo compactado alternativo.
          - _Nota:_ ${mac_note}

          ### Android (10+)
          - **Edição Direta** (\`MasterSync-Android-Direto*.apk\`): recomendada para instalação direta sem avisos extras do Play Protect (não inclui espelhamento de notificações/mídia de outros apps).
          - **Edição Completa** (\`MasterSync-Android-Completo*.apk\`): inclui espelhamento de notificações e controles do Mini Player.
          - _Nota:_ ${android_note}

          ### Integridade
          Consulte \`SHA256SUMS.txt\` para validar os hashes dos arquivos.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$IS_ROLLING" == "true" ]]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" -F force=true || true
            fi
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=(--target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.md)
            if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            else
              args+=(--latest)
            fi
            gh release create "$TAG" release-assets/* "${args[@]}"
          fi
